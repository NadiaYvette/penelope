id: phase3-03-disjunctive-fanout
title: Implement Disjunctive Multi-Exit Fanout Combinator (>?<)
description: |
  Implement Milestone 3.3 of Phase 3 (Polycategorical Composition & The Frame Rule
  per ~/src/penelope/PLAN.md §Phase 3 and docs/notes/IMPLEMENTATION_PLAN.md §Phase 3).
  Extends `Penelope.Core.Wiring` in `packages/penelope-core` with the disjunctive
  multi-exit fanout combinator `(>?<)`.

  Architectural Context:
  - Disjunctive Multi-Exit Architecture: Rather than nesting binary coproducts (`Either (Either a b) c`),
    Penelope operations define an arbitrary $k$-ary row of disjunctive exits (`exits :: Row (Row Type)`).
  - Combinator `(>?<)`: Binds an operation's exit channels to a `Record` of $k$ downstream branch continuations
    in $O(1)$ time by directly mapping exit continuations into downstream stages.
  - Zero Sum Cascades: Replaces linear `case` cascades with flat array dispatch over the variant payload.
  - Ground Note [Core Architecture] [ref:note-core-architecture] and
    Note [Unpacked Polycategorical Representation] [ref:note-unpacked-representation].

