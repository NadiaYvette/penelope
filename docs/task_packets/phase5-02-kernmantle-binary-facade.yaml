      1. Define `newtype Rope eh ef a b = Rope { unRope :: Penelope eh ef '["in" := a] '["out" := b] }`.
      2. Implement `Category`, `Arrow`, `ArrowChoice`, `Profunctor`, `Strong`, and `Choice`.
      3. Implement `deriveRouter` compiling record of branch handlers to $O(1)$ variant jump table.
      4. Re-export binary facade from `packages/penelope-effects/src/Penelope/Effects.hs`.
      5. Ground Note [Zero-Cost Surface Specializations] [ref:note-surface-facades].
