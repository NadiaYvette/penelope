id: phase5-02-kernmantle-binary-facade
title: Implement the Kernmantle Binary Arrow Facade (Rope)
description: |
  Implement Milestone 5.2 of Phase 5 (Surface Ergonomics & Compatibility Facades
  per ~/src/penelope/PLAN.md §Phase 5 and docs/notes/IMPLEMENTATION_PLAN.md §Phase 5).
  Establishes `Penelope.Effects.Binary` in `packages/penelope-effects`, providing the
  `Rope eh ef a b` binary arrow facade and router derivation.

  Architectural Context:
  - Zero-Cost Binary Specialization: Binary arrow pipelines are projected over the core engine
    via a newtype wrapper with zero runtime penalty:
    `newtype Rope eh ef a b = Rope { unRope :: Penelope eh ef '["in" := a] '["out" := b] }`
    (Note [Zero-Cost Surface Specializations] [ref:note-surface-facades]).
  - Arrow & Profunctor Hierarchy: Implements `Category`, `Arrow`, `ArrowChoice`, `Profunctor`,
    `Strong`, and `Choice` for `Rope eh ef`.
  - Static Jump-Table Router: `deriveRouter` compiles a `Record` of `Rope` handlers into an $O(1)$
    jump table over `Polytropos.Variant`, eliminating linear branching cascades and nested
    coproduct shuffles (`Either (Either a b) c`).
  - Ground Note [Zero-Cost Surface Specializations] [ref:note-surface-facades].

dependencies:
