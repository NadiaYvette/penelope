id: phase3-04-row-weakening
title: Implement Zero-Traversal Row Weakening via ScopeRow
description: |
  Implement Milestone 3.4 of Phase 3 (Polycategorical Composition & The Frame Rule
  per ~/src/penelope/PLAN.md §Phase 3 and docs/notes/IMPLEMENTATION_PLAN.md §Phase 3).
  Extends `Penelope.Core.Wiring` in `packages/penelope-core` with zero-traversal row
  weakening primitives via `ScopeRow`.

  Architectural Context:
  - Institutional Satisfaction Invariant: Subprograms are embedded into wider effect rows
    without traversing the syntax tree to re-tag `Word#` indices. Using Goguen-Burstall
    institutions and the satisfaction condition
    (eval_J(H, \sigma_*(P)) = eval_I(\sigma^*(H), P)), embedding is realized as an
    $O(|eh_1| + |ef_1|)$ contravariant gathering of the handler record (`gatherRecord σ H`)
    at `ScopeRow` boundary nodes
    (Note [Institutional Satisfaction and Zero-Traversal Weakening] [ref:note-satisfaction-weakening]).
  - Zero-Traversal Embedding: Wraps an inner program in `ScopeRow` in $O(1)$ time:
    `weakenRow :: (KnownRowMorph ehSub ehFull, KnownRowMorph efSub efFull) => Penelope ehSub efSub ins outs -> Penelope ehFull efFull ins outs`.
    `weakenEF :: KnownRowMorph efSub efFull => Penelope eh efSub ins outs -> Penelope eh efFull ins outs`.
    `weakenEH :: KnownRowMorph ehSub ehFull => Penelope ehSub ef ins outs -> Penelope ehFull ef ins outs`.
  - Ground Note [Institutional Satisfaction and Zero-Traversal Weakening] [ref:note-satisfaction-weakening].

