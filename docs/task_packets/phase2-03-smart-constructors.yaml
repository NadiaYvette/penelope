---
id: phase2-03-smart-constructors
title: Implement Zero-Overhead Smart Constructors (sendPolyF and sendPolyH)
description: |
  Implement Milestone 2.3 of Phase 2 (Core (m,n,k,r)-ary Syntax & Unpacked Representation
  per ~/src/penelope/PLAN.md §Phase 2 and docs/notes/IMPLEMENTATION_PLAN.md §Phase 2).
  Establishes `Penelope.Core.Send` in `packages/penelope-core`, providing zero-overhead smart
  constructors injecting first-order and higher-order effect operations.

  Architectural Context:
  - Compile-Time Tag Lookup: Uses `ConstructorIndex l ef` (or `ConstructorIndex l eh`) solved
    by `Polytropos.Plugin` to resolve unboxed `Word#` variant tags with zero runtime dictionary passing.
  - First-Order Injection (`sendPolyF`):
    Injects operation payload with `unsafeCoerce#` and static input gather wiring via `KnownRowMorph`.
    Connects to a single return branch continuation or multi-exit record.
  - Higher-Order Scoped Injection (`sendPolyH`):
    Packages scoped sub-regions into `Record (Region eh ef) regions` with static input gather wiring.
  - Ground Note [Unpacked Polycategorical Representation] [ref:note-unpacked-representation].

