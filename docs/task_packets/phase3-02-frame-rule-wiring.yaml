---
id: phase3-02-frame-rule-wiring
title: Implement Frame-Rule Automatic Port Wiring Combinator (>&>)
description: |
  Implement Milestone 3.2 of Phase 3 (Polycategorical Composition & The Frame Rule
  per ~/src/penelope/PLAN.md §Phase 3 and docs/notes/IMPLEMENTATION_PLAN.md §Phase 3).
  Extends `Penelope.Core.Wiring` in `packages/penelope-core` with the frame-rule
  automatic port wiring combinator `(>&>)`.

  Architectural Context:
  - Frame-Rule Wiring:
    `(>&>) :: (FrameWire frameIn ins1 outs1 frameMid, FrameWire frameMid ins2 outs2 frameOut) => Penelope eh ef ins1 outs1 -> Penelope eh ef ins2 outs2 -> Penelope eh ef frameIn frameOut`.
  - Automatic Port Threading: Given `stage1` producing `outs1` and `stage2` requiring `ins2`
    (a subset of `frameMid`), Penelope uses compile-time synthesized `FrameWire` to pull arguments
    from the live register frame and write back results, leaving unmentioned frame ports untouched
    (Note [Frame-Rule Automatic Wire Synthesis] [ref:note-frame-rule-wiring]).
  - Zero-Cost passthrough: Frame slots unaffected by individual pipeline stages are preserved in
    $O(|frame|)$ time without manual tuple nesting (`(a, (b, c))`).
  - Ground Note [Frame-Rule Automatic Wire Synthesis] [ref:note-frame-rule-wiring].

dependencies:
  - phase3-01-sequential-composition

packages:
  - penelope-core

executor: script
model: gemini-3.8-flash-high
skills:
  - tricorder
  - code-navigation
  - contextful
max_turns: 12
run_budget: 600
max_repair_attempts: 3

steps:
