    name: Implement frame-rule combinator (>&>)
    action: |
      In `packages/penelope-core/src/Penelope/Core/Wiring.hs`:
      1. Implement `(>&>)` using `FrameWire` constraints solved by `Polytropos.Plugin`.
      2. Synthesize pre-stage input gather routing and post-stage output scatter routing.
      3. Re-export `(>&>)` from `packages/penelope-core/src/Penelope/Core.hs`.
      4. Ground Note [Frame-Rule Automatic Wire Synthesis] [ref:note-frame-rule-wiring].
    duration: "45m"

  - id: add-frame-rule-wiring-tests
    name: Implement unit tests in packages/penelope-core/test/Main.hs
    action: |
      In `packages/penelope-core/test/Main.hs`:
      1. Construct multi-stage pipeline across a composite register frame (e.g. `'["x" := Int, "y" := Text, "z" := Bool]`).
      2. Verify that stage 1 mutating `"x"` preserves `"y"` and `"z"` untouched.
      3. Verify that stage 2 consuming `"x"` and `"y"` updates `"z"`.
      4. Verify clean compilation under `-Wall -Wcompat -Wredundant-constraints`.
    duration: "30m"

  - id: verify-gate
    name: Run verification gate
    action: |
      Run `cabal test penelope-core:test:tests` and execute `sh scripts/tasks/phase3-02-frame-rule-wiring-verify.sh`.
    duration: "10m"

